name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,postgres]"
          python -m pip check

      # The suite asserts the console is SERVED — /app answering 200, the sign-in page
      # being the bundle. src/api/static/app/ is gitignored, so on a clean checkout none
      # of that exists and seven tests fail as an unexplained 503. A developer never sees
      # it because their working tree has a build in it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the console the tests serve
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest -q

      - name: Audit dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --local

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_automation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_automation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sales_automation_test
      INTERNAL_API_TOKEN: ci-test-token
      INBOUND_WORKER_ENABLED: "false"
      INBOUND_POLL_ENABLED: "false"
      SEND_WORKER_ENABLED: "false"
      INBOUND_AUTO_ACK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,postgres]"
      # This job asserts "app health", and readiness now includes the console — a release
      # nobody can log into is not ready. Building it here is what makes that assertion
      # true against real Postgres, which is the combination production runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the console
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Apply migrations twice
        run: |
          python scripts/init_db.py
          python scripts/init_db.py
      - name: Verify Postgres schema and app health
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from src.db.session import engine

          tables = set(inspect(engine).get_table_names())
          required = {"_migrations", "contacts", "conversations", "messages", "inbound_jobs"}
          assert required <= tables, required - tables
          PY
          pytest -q tests/test_smoke.py tests/test_api_health.py::test_healthz_no_token

  console:
    # The calculator's arithmetic is a customer quote, so it is pinned against what the
    # pre-React calculator rendered. Runs on its own because nothing here needs Python.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Test
        run: npm --prefix frontend test
      - name: Typecheck and build
        run: npm --prefix frontend run build

  exporter:
    # 가공 레포의 Actions 가 매일 09:15 에 운영자가 고른 커밋(EXPORTER_COMMIT)의 agent/ 를 빌드해 돌린다
    # (2026-10-01). 그 잡은 스냅샷과 시크릿을 쥐어서 go vet · go test 를 돌리지 않는다 — 테스트는 여기서만 돌고,
    # 여기가 빨간 커밋은 고르지 않는다(agent/README.md 「방어」).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false
      # 가공 워크플로와 같은 DuckDB(snapshot.go 의 버전 · 같은 체크섬)를 PATH 에 둔다 — 가공 범위 SQL 테스트는
      # duckdb 가 있을 때만 돌고, 없으면 조용히 건너뛰어 초록으로 보인다.
      - name: DuckDB CLI
        run: |
          set -euo pipefail
          V=$(grep -oE 'duckdbVersion = "[0-9.]+"' snapshot.go | grep -oE '[0-9.]+')
          curl -fsSL -o duckdb_cli-linux-amd64.zip "https://github.com/duckdb/duckdb/releases/download/v$V/duckdb_cli-linux-amd64.zip"
          sha256sum -c duckdb-linux-amd64.sha256
          mkdir -p "$RUNNER_TEMP/duckdb" && unzip -q -o duckdb_cli-linux-amd64.zip duckdb -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      # tee — 건너뛰거나 실패했을 때 그 이유(「DuckDB 가 없습니다: …」)가 로그에 남는다. grep -q 로 바로 받으면 안 남는다.
      - run: go vet ./... && go test -v -run TestUniverse ./... | tee "$RUNNER_TEMP/universe.log" && grep -q -- '--- PASS' "$RUNNER_TEMP/universe.log" && go test ./...

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag sales-automation:ci .
