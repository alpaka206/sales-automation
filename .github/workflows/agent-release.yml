# 로컬 데이터 에이전트(agent/)를 세 타깃으로 빌드해 GitHub Release 에 올립니다.
#
# 바이너리를 git 에 넣지 않는 이유: 셋을 합치면 100MB 이고 커밋마다 따라옵니다. Render 빌드에
# 넣지 않는 이유: 그 인스턴스는 Python 런타임이라 Go 가 없고, 512Mi 무료 인스턴스가 100MB 를
# 서빙할 이유가 없습니다. 저장소가 공개라 Release 자산은 인증 없이 받아지고, 콘솔의 내려받기
# 버튼이 `releases/latest/download/<파일>` 을 가리킵니다.
#
# 러너가 macOS 인 이유: Mac 은 `Perso Agent.app` 으로 싸서 Developer ID 로 서명하고 Apple 에
# 공증(notarize)한 뒤 티켓을 붙여야(staple) Gatekeeper 의 「악성 코드가 없음을 확인할 수 없습니다」가
# 안 뜹니다. codesign · notarytool 은
# macOS 에만 있고, Go 는 CGO 없이 어디서든 세 타깃을 냅니다. 공증은 사람 심사가 아니라 자동
# 스캔이지만 큐가 밀리면 30분도 걸립니다. 서명 Secrets 가 없으면 그 단계만 건너뛰고 서명 없이
# 올립니다.
#
# 내는 법:  git tag agent-v1.0.0 && git push origin agent-v1.0.0
name: Agent release

on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    # 공증 대기가 대부분입니다. 30분이었을 때 arm64 하나가 28분 걸려 intel 은 제출도 못 하고
    # 잘렸습니다(2026-09-17). 아래에서 둘을 동시에 제출하지만, 큐가 밀리는 날의 여유를 둡니다.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: agent
    env:
      # step 의 if 는 secrets 를 못 읽어서 env 로 한 번 옮깁니다.
      HAS_CERT: ${{ secrets.APPLE_CERT_P12_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: DuckDB CLI zips (embed 됩니다 — 버전은 snapshot.go 의 duckdbVersion)
        run: |
          set -e
          V=$(grep -oE 'duckdbVersion = "[0-9.]+"' snapshot.go | grep -oE '[0-9.]+')
          echo "DuckDB $V"
          curl -fsSL -o bin/duckdb-windows-amd64.zip   "https://github.com/duckdb/duckdb/releases/download/v$V/duckdb_cli-windows-amd64.zip"
          curl -fsSL -o bin/duckdb-darwin-universal.zip "https://github.com/duckdb/duckdb/releases/download/v$V/duckdb_cli-osx-universal.zip"
          ls -la bin/
      - run: go vet ./... && go test ./...
      - name: Build (CGO 없음 — 한 대에서 세 타깃, 버전은 태그에서)
        run: |
          set -e
          V="${GITHUB_REF_NAME#agent-v}"
          echo "version=$V"
          LD="-s -w -X main.version=$V"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LD" -o dist/perso-agent.exe .
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LD" -o dist/perso-agent-mac-arm64 .
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LD" -o dist/perso-agent-mac-intel .

      # **Mac 은 앱으로 준다** (2026-09-17). 맨 실행 파일은 공증을 받아도 Finder 더블클릭에서 막힌다 —
      # 운영자 맥과 macOS 14·15 러너에서 똑같이 잰 결과: `spctl -t install` 은 `accepted · Notarized
      # Developer ID` 인데 더블클릭이 쓰는 `spctl -t exec` 은 `rejected (the code is valid but does
      # not seem to be an app)`. 그리고 브라우저로 받은 맨 파일은 실행 권한도 없어 텍스트 편집기로 열렸다.
      # 번들은 두 문제를 같이 없앤다. 실행 파일은 arm64·intel 을 합친 universal 하나라 맥 종류를 안 고른다.
      # `persodata://` 도 Info.plist 로 등록돼, 콘솔의 「에이전트 열기」가 맥에서도 앱을 띄운다.
      - name: Mac 앱 번들 (universal)
        run: |
          set -e
          V="${GITHUB_REF_NAME#agent-v}"
          APP="dist/Perso Agent.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/perso-agent" dist/perso-agent-mac-arm64 dist/perso-agent-mac-intel
          chmod 755 "$APP/Contents/MacOS/perso-agent"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>perso-agent</string>
            <key>CFBundleIdentifier</key><string>ai.perso.agent</string>
            <key>CFBundleName</key><string>Perso Agent</string>
            <key>CFBundleDisplayName</key><string>Perso Agent</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$V</string>
            <key>CFBundleVersion</key><string>$V</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>CFBundleURLTypes</key>
            <array><dict>
              <key>CFBundleURLName</key><string>ai.perso.agent</string>
              <key>CFBundleURLSchemes</key><array><string>persodata</string></array>
            </dict></array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/perso-agent"

      - name: Mac 서명 (Developer ID · hardened runtime · 타임스탬프 — 공증의 세 조건)
        if: env.HAS_CERT == 'true'
        env:
          P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -e
          echo "$P12_B64" | base64 --decode > /tmp/cert.p12
          # 러너마다 새 키체인 — 러너는 일회용이라 남지 않습니다.
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Apple 중간 인증서 — 없으면 체인이 안 이어져 서명은 되는데 공증이 거절됩니다.
          curl -fsSL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/DeveloperIDG2CA.cer -k build.keychain -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          IDENT=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "identity: $IDENT"
          test -n "$IDENT"
          for f in perso-agent-mac-arm64 perso-agent-mac-intel "Perso Agent.app"; do
            codesign --force --options runtime --timestamp --sign "$IDENT" "dist/$f"
            codesign --verify --strict --verbose=2 "dist/$f"
          done
          rm -f /tmp/cert.p12

      - name: Mac 공증 (Apple 자동 스캔 — 사람 심사 아님, 큐에 따라 몇 분~30분)
        if: env.HAS_CERT == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -e
          printf '%s' "$NOTARY_KEY_P8" > /tmp/notary.p8
          trap 'rm -f /tmp/notary.p8' EXIT

          # 앱과 맨 바이너리 둘(터미널에서 `curl -LO` 로 받는 사람)을 동시에 제출합니다. 순차로 기다리면
          # 큐가 밀리는 날 대기가 쌓입니다. 제출은 zip 으로 합니다(notarytool 이 받는 모양).
          ITEMS=("perso-agent-mac-arm64" "perso-agent-mac-intel" "Perso Agent.app")
          for f in "${ITEMS[@]}"; do
            ditto -c -k --keepParent "dist/$f" "/tmp/$f.zip"
          done
          for f in "${ITEMS[@]}"; do
            xcrun notarytool submit "/tmp/$f.zip" \
              --key /tmp/notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 60m --output-format json \
              > "/tmp/$f.json" 2> "/tmp/$f.err" &
          done
          # 한쪽이 실패해도 나머지 결과를 봐야 하므로 여기서 죽이지 않습니다.
          wait || true

          # notarytool 은 결과가 Invalid 여도 0 을 내는 경우가 보고돼 있습니다. 상태를 직접 봅니다.
          rc=0
          for f in "${ITEMS[@]}"; do
            echo "--- $f ---"
            cat "/tmp/$f.err" || true
            cat "/tmp/$f.json" || true
            echo
            S=$(jq -r '.status // empty' "/tmp/$f.json" 2>/dev/null || true)
            ID=$(jq -r '.id // empty' "/tmp/$f.json" 2>/dev/null || true)
            echo "$f: status=${S:-<없음>}"
            if [ "$S" != "Accepted" ]; then
              rc=1
              if [ -n "$ID" ]; then
                xcrun notarytool log "$ID" \
                  --key /tmp/notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
              fi
            fi
          done
          exit $rc

      # 티켓을 앱에 붙인다 — 그러면 맥이 Apple 서버에 못 닿아도(사내망·오프라인) 첫 실행이 통과한다.
      # 맨 바이너리에는 붙일 수 없다(stapler 는 .app/.pkg/.dmg 만 받는다).
      - name: Mac 티켓 부착 (staple)
        if: env.HAS_CERT == 'true'
        run: |
          set -e
          xcrun stapler staple "dist/Perso Agent.app"
          xcrun stapler validate "dist/Perso Agent.app"

      # 풀면 `Perso Agent.app` 하나가 나온다. `ditto` 는 실행 권한과 서명(확장 속성)을 그대로 담는다.
      - name: Mac zip
        run: |
          set -e
          cd dist
          ditto -c -k --keepParent "Perso Agent.app" perso-agent-mac.zip
          unzip -Z1 perso-agent-mac.zip | head -5

      # **더블클릭과 같은 판정을 여기서 통과해야 릴리스한다.** 브라우저로 받은 것처럼 격리 속성을 달고,
      # Finder 가 쓰는 `spctl -t exec` 이 `accepted · Notarized Developer ID` 인지 본다. 1.3.0~1.3.3 은
      # 서명·공증이 다 됐는데 이 판정 하나에서 떨어졌고, 그건 맥을 들고 있는 사람만 알았다.
      - name: Mac 검증 — 받은 zip 을 더블클릭했을 때의 판정
        if: env.HAS_CERT == 'true'
        run: |
          set -e
          rm -rf /tmp/gk && mkdir -p /tmp/gk
          cp dist/perso-agent-mac.zip /tmp/gk/
          Q="0081;$(printf %x "$(date +%s)");Chrome;$(uuidgen)"
          xattr -w com.apple.quarantine "$Q" /tmp/gk/perso-agent-mac.zip
          ditto -x -k /tmp/gk/perso-agent-mac.zip /tmp/gk/out
          APP="/tmp/gk/out/Perso Agent.app"
          xattr -w com.apple.quarantine "$Q" "$APP"
          OUT=$(spctl -a -vvv -t exec "$APP" 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q ": accepted" && echo "$OUT" | grep -q "source=Notarized Developer ID"
          xcrun stapler validate "$APP"
          "$APP/Contents/MacOS/perso-agent" --version

      # **앱으로 떠서 응답하는지** — Finder 더블클릭과 같은 길(`open`, Launch Services)로 띄워 /v1/health 를
      # 본다. 창 없이 뜨는 앱이라 인자 처리나 실행 방식이 틀려도 화면에 아무것도 안 남는다. 격리 속성은
      # 뗀다: 떼지 않으면 첫 실행의 「인터넷에서 받은 앱을 열까요?」 확인 창이 사람 없는 러너를 붙잡는다
      # (그 판정 자체는 바로 위 단계가 봤다).
      - name: Mac 검증 — 앱으로 띄워서 응답하는지
        if: env.HAS_CERT == 'true'
        run: |
          set -e
          rm -rf /tmp/launch && mkdir -p /tmp/launch/snap/data
          echo '{}' > /tmp/launch/snap/data/manifest.json
          ditto -x -k dist/perso-agent-mac.zip /tmp/launch
          xattr -dr com.apple.quarantine "/tmp/launch/Perso Agent.app" || true
          open "/tmp/launch/Perso Agent.app" --args --repo /tmp/launch/snap --no-browser
          for i in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:43110/v1/health; then echo; OK=1; break; fi
            sleep 1
          done
          pkill -f "Perso Agent.app/Contents/MacOS/perso-agent" || true
          test "${OK:-}" = 1

      - name: 체크섬
        run: |
          cd dist
          shasum -a 256 perso-agent.exe perso-agent-mac-arm64 perso-agent-mac-intel perso-agent-mac.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/perso-agent.exe
            agent/dist/perso-agent-mac.zip
            agent/dist/perso-agent-mac-arm64
            agent/dist/perso-agent-mac-intel
            agent/dist/SHA256SUMS.txt
          body: |
            로컬 데이터 에이전트 ${{ github.ref_name }}.
            **Mac**: `perso-agent-mac.zip` 을 받아 풀고, 나온 `Perso Agent` 앱을 더블클릭하세요(Apple 공증·티켓 부착). 창 없이 뒤에서 돌고 브라우저가 열립니다.
            **Windows**: `perso-agent.exe` 를 실행하세요.
            스냅샷 폴더(`perso-data-snapshot` 또는 `perso-data-snapshot-main`)는 에이전트 옆이나 홈·다운로드·데스크톱·문서 폴더에 두면 찾습니다.
            원본도 집계도 콘솔 서버로 가지 않습니다 — 계산은 이 PC 에서 끝납니다. 사용법: `agent/README.md`
