{% from "partials/icons.html" import icon %}<!DOCTYPE html>
<html lang="ko" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>승인 대기 — PERSO Inbound</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <div style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg)">
    <div class="card" style="width:100%;max-width:420px;text-align:center;padding:32px">
      <div class="empty__icon" style="margin:0 auto 14px">{{ icon("clock", 24) }}</div>
      <h1 style="font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px">접근 승인 대기</h1>
      <p class="t-sm t-muted" style="margin:0 0 6px">
        <span class="mono">{{ email }}</span> · 관리자 승인 필요
      </p>
      <a href="/auth/logout" class="btn btn--subtle" style="width:100%">{{ icon("reply", 15) }} 다른 계정으로 로그인</a>
    </div>
  </div>
</body>
</html>
