{% from "partials/icons.html" import icon %}<!DOCTYPE html>
<html lang="ko" data-theme="light" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>승인 대기 — PERSO Sales Console</title>
  <script>(function(){try{var t=localStorage.getItem("perso-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px;
              background:radial-gradient(1200px 600px at 100% -5%, var(--bg-grad-1), var(--bg-grad-2) 55%)">
    <div class="card" style="width:100%;max-width:420px;text-align:center;padding:32px">
      <div class="empty__icon" style="margin:0 auto 14px">{{ icon("clock", 24) }}</div>
      <h1 style="font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px">접근 승인 대기</h1>
      <p class="t-sm t-muted" style="margin:0 0 6px">
        <span class="mono">{{ email }}</span> 계정은 아직 승인되지 않았습니다.
      </p>
      <p class="t-sm t-muted" style="margin:0 0 22px">
        도메인 인증은 통과했습니다. 관리자에게 접근 승인을 요청하세요.
      </p>
      <a href="/auth/logout" class="btn btn--subtle" style="width:100%">{{ icon("reply", 15) }} 다른 계정으로 로그인</a>
    </div>
  </div>
</body>
</html>
