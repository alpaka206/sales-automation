# Render Blueprint — defines the FastAPI Web Service.
#
# Free tier notes:
# - Free Web Service spins down after 15 minutes of inactivity. First request
#   after sleep takes ~30 seconds. HubSpot webhook retries handle this fine.
# - The free instance has 512 MB RAM, which is plenty.
# - SQLite WILL NOT survive deploys here — set DATABASE_URL to a managed
#   Postgres (Supabase / Neon) before pushing live data.
#
# Usage:
# 1. Push this repo to GitHub.
# 2. Render dashboard → New → Blueprint → connect your GitHub repo → pick `main`.
# 3. Fill the env vars marked `sync: false` in the dashboard.
# 4. First deploy runs the build (installs deps + applies migrations).

services:
  - type: web
    name: sales-automation
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-postgres.txt
      python scripts/init_db.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ----- Required: set these manually in the Render dashboard -----
      - key: DATABASE_URL              # Supabase / Neon Postgres URI
        sync: false
      - key: HUBSPOT_PRIVATE_APP_TOKEN
        sync: false
      - key: HUBSPOT_WEBHOOK_SECRET    # HubSpot app client secret — required for webhook signature check
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON   # Vertex AI service-account JSON (full contents)
        sync: false
      - key: GOOGLE_CLOUD_PROJECT      # optional; falls back to JSON project_id
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APPROVAL_CHANNEL_ID
        sync: false
      - key: PUBLIC_BASE_URL           # set to the Render URL after 1st deploy (Slack approval links)
        sync: false
      - key: WEB_UI_PASSWORD           # web UI login (HTTP Basic Auth) — used when AUTH_MODE=basic
        sync: false

      # ----- Web UI login: Google OAuth (optional; keep AUTH_MODE=basic until configured) -----
      # Dashboard-managed so flipping to "google_oauth" there isn't reverted by the blueprint.
      # Unset => defaults to "basic" in config (no lockout).
      - key: AUTH_MODE                 # set "basic" or "google_oauth" in the Render dashboard
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID    # Google Cloud OAuth 2.0 web client; redirect URI = <PUBLIC_BASE_URL>/auth/callback
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN      # only verified Google accounts on this domain may sign in
        value: estsoft.com
      - key: WEB_UI_ADMIN_EMAILS       # comma-separated bootstrap admins (auto-approved)
        sync: false
      - key: WEB_UI_ALLOWED_EMAILS     # comma-separated pre-approved emails (no admin action needed)
        sync: false
      - key: SESSION_SECRET            # random long string; required when AUTH_MODE=google_oauth
        generateValue: true

      # ----- Optional: Google Sheets mirror (separate service account) -----
      - key: GSHEETS_ENABLED           # set "true" to enable, then fill the two below
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false

      # ----- Auto-generated on first deploy -----
      - key: INTERNAL_API_TOKEN
        generateValue: true

      # ----- Sensible defaults (override in dashboard if needed) -----
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-2.5-pro
      - key: GOOGLE_CLOUD_LOCATION
        value: global
      - key: GOOGLE_SHEETS_INBOUND_TAB
        value: Inbound
      - key: EMAIL_PROVIDER
        value: hubspot
      - key: APPROVAL_CHANNEL
        value: slack
      - key: WEB_UI_USERNAME
        value: admin
      # Free tier: no always-on workers. Approve sends inline; webhooks drive inbound.
      - key: SEND_WORKER_ENABLED
        value: "false"
      - key: INBOUND_POLL_ENABLED
        value: "false"
      - key: AUTO_SEND_THRESHOLD
        value: "1.01"
      - key: TIMEZONE
        value: Asia/Seoul
      - key: LOG_LEVEL
        value: INFO
      - key: APP_HOST
        value: 0.0.0.0
