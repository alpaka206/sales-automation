[project]
name = "sales-automation"
version = "0.1.0"
description = "Inbound inquiry, customer history, and sales operations with human-approved replies."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.14.2,<3",
    "httpx>=0.27,<1",
    "httplib2>=0.32,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.31,<1",
    "starlette>=1.3.1,<2",
    "google-genai>=0.3,<3",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.30,<3",
    "cryptography>=48.0.1,<50",
    # Lets Python verify TLS against the OS trust store. Required on networks that
    # re-sign HTTPS with a private root (the ESTsoft office appliance does); certifi
    # alone fails every outbound call there. See src/common/tls.py.
    "truststore>=0.10,<1",
]

[project.optional-dependencies]
# Install with: pip install .[postgres]  — required when DATABASE_URL is postgres://
postgres = ["psycopg2-binary>=2.9,<3"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
    "respx>=0.21,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly. This is what ruff enforced by default when this
# project was written, and the codebase is clean under it. Leaving it implicit made
# CI's behaviour depend on whichever ruff the `>=0.6,<1` range resolved to that day:
# a release in late July 2026 widened the defaults (UP/I/BLE/DTZ/RUF/S/...) and every
# build started failing on untouched files — including commits that had passed before.
# Widen this deliberately if you want more rules, but do it in a commit that also
# fixes the findings, so lint stays a signal rather than noise.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Non-Python files that must ride along inside the wheel. The React console is BUILT, not
# committed (see .gitignore), so `npm --prefix frontend ci && npm --prefix frontend run
# build` has to run before `pip wheel .` — without it the console answers 503 and says so.
[tool.setuptools.package-data]
"src.api.web" = [
    "static/*",
    "static/app/*",
    "static/app/assets/*",
    "templates/*.html",
    "templates/*/*.html",
]
