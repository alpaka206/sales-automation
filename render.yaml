# Render Blueprint — defines the FastAPI Web Service.
#
# Free tier notes:
# - Free Web Service spins down after 15 minutes of inactivity. First request
#   after sleep takes ~30 seconds. HubSpot webhook retries handle this fine.
# - The free instance has 512 MB RAM, which is plenty.
# - SQLite WILL NOT survive deploys here — set DATABASE_URL to a managed
#   Postgres (Supabase / Neon) before pushing live data.
#
# Usage:
# 1. Push this repo to GitHub.
# 2. Render dashboard → New → Blueprint → connect your GitHub repo → pick `main`.
# 3. Fill the env vars marked `sync: false` in the dashboard.
# 4. First deploy runs the build (installs deps + applies migrations).

services:
  - type: web
    name: sales-automation
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip setuptools
      pip install ".[postgres]"
      python scripts/init_db.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ----- Required: set these manually in the Render dashboard -----
      - key: DATABASE_URL              # Supabase / Neon Postgres URI
        sync: false
      # Two secrets — set these in the Render dashboard (HubSpot App -> Auth tab).
      - key: HUBSPOT_ACCESS_TOKEN      # Private App access token (pat-na1-...)
        sync: false
      - key: HUBSPOT_WEBHOOK_SECRET    # Client secret — required for webhook v3 signature check
        sync: false
      # [B2B] AI Dubbing pipeline (798618015) stage IDs — set here, no dashboard entry needed.
      - key: HUBSPOT_TICKET_STAGE_NEW
        value: "1172180243"            # New — the webhook "new inbound" trigger
      - key: HUBSPOT_TICKET_STAGE_AFTER_SEND
        value: "1193842435"            # Meeting Link Sent — moved here after a reply is sent
      - key: HUBSPOT_TICKET_STAGE_NEGOTIATION
        value: "1193733925"            # Negotiating
      - key: HUBSPOT_TICKET_STAGE_CLOSED_LOST
        value: "1172180246"            # Lost
      - key: GOOGLE_CREDENTIALS_JSON   # Vertex AI service-account JSON (full contents)
        sync: false
      - key: GOOGLE_CLOUD_PROJECT      # optional; falls back to JSON project_id
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APPROVAL_CHANNEL_ID
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL           # Render URL (Slack approval links, OAuth redirect base)
        value: https://sales-automation-4if2.onrender.com
      - key: WEB_UI_PASSWORD           # web UI login (HTTP Basic Auth) — used when AUTH_MODE=basic
        sync: false

      # ----- Web UI login: Google OAuth (optional; keep AUTH_MODE=basic until configured) -----
      # Dashboard-managed so flipping to "google_oauth" there isn't reverted by the blueprint.
      # Unset => defaults to "basic" in config (no lockout).
      - key: AUTH_MODE                 # set "basic" or "google_oauth" in the Render dashboard
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID    # Google Cloud OAuth 2.0 web client; redirect URI = <PUBLIC_BASE_URL>/auth/callback
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN      # only verified Google accounts on this domain may sign in
        value: estsoft.com
      - key: WEB_UI_ADMIN_EMAILS       # comma-separated bootstrap admins (auto-approved)
        sync: false
      - key: WEB_UI_ALLOWED_EMAILS     # comma-separated pre-approved emails (no admin action needed)
        sync: false
      - key: SESSION_SECRET            # random long string; required when AUTH_MODE=google_oauth
        generateValue: true

      # ----- Optional: separate credential for Sheets -----
      # If omitted, GOOGLE_CREDENTIALS_JSON is reused automatically.
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_SHEETS_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_SHEETS_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY # delegated refresh-token encryption; separate from session/API secrets
        generateValue: true

      # ----- Auto-generated on first deploy -----
      - key: INTERNAL_API_TOKEN
        generateValue: true

      # ----- Pre-launch safety -----
      # LIVE_EXTERNAL_WRITES is intentionally NOT declared here: the code default
      # is false (SAFE) — all HubSpot writes blocked, every email forced to the
      # test recipient. To GO LIVE, add LIVE_EXTERNAL_WRITES=true in the Render
      # dashboard (a dashboard var persists across deploys) AND clear
      # SEND_OVERRIDE_EMAIL. Until then the webhook only detects + drafts.

      # ----- Sensible defaults (override in dashboard if needed) -----
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-2.5-pro
      - key: GOOGLE_CLOUD_LOCATION
        value: global
      - key: APPROVAL_CHANNEL
        value: none
      - key: SLACK_ENABLED
        value: "false"
      - key: WEB_UI_USERNAME
        value: admin
      # Webhook is primary; poller is the 10-minute recovery path for missed events.
      - key: SEND_WORKER_ENABLED
        value: "true"
      - key: INBOUND_POLL_ENABLED
        value: "true"
      - key: INBOUND_WORKER_ENABLED
        value: "true"
      - key: INBOUND_INITIAL_LOOKBACK_HOURS
        value: "24"
      - key: AUTO_SEND_THRESHOLD
        value: "1.01"
      - key: TIMEZONE
        value: Asia/Seoul
      - key: LOG_LEVEL
        value: INFO
      - key: APP_HOST
        value: 0.0.0.0
      - key: WEB_CONCURRENCY
        value: "1"
