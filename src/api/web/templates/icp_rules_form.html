{% extends "base.html" %}
{% block title %}{{ rule.source }} ICP 룰 편집 — Sales Automation{% endblock %}
{% block content %}

<div class="mb-6">
  <a href="/icp-rules" class="text-sm text-blue-600 hover:underline">&larr; ICP 룰 목록</a>
</div>

<div class="bg-white rounded-lg shadow-sm border p-6 max-w-3xl">
  <h1 class="text-lg font-bold text-gray-800 mb-2">{{ rule.source }} ICP 점수 기준</h1>
  <p class="text-sm text-gray-500 mb-6">이 소스에서 발굴된 프로스펙트의 ICP 점수 산정 시 아래 기준이 프롬프트에 추가됩니다.</p>

  <form id="icp-form">
    <div class="mb-4">
      <label class="block text-xs text-gray-500 mb-1">기준 (Markdown)</label>
      <textarea name="criteria_md" rows="14"
                class="w-full border rounded px-3 py-2 text-sm font-mono leading-relaxed"
                placeholder="## 가점&#10;- +15: SaaS 기업&#10;&#10;## 감점&#10;- -10: 개인 이메일"
                >{{ rule.criteria_md }}</textarea>
    </div>

    <div class="mb-4">
      <label class="inline-flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" name="enabled" value="on"
               {% if rule.enabled %}checked{% endif %}
               class="rounded border-gray-300">
        활성화
      </label>
    </div>

    <button type="button"
            hx-post="/icp-rules/{{ rule.source }}" hx-include="#icp-form"
            hx-target="#action-result" hx-swap="innerHTML"
            class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
      저장
    </button>
  </form>

  <div id="action-result" class="mt-4"></div>
</div>

{% endblock %}
