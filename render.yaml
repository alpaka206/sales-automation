# Render Blueprint — defines the FastAPI Web Service.
#
# Free tier notes:
# - Free Web Service spins down after 15 minutes of inactivity. First request
#   after sleep takes ~30 seconds. HubSpot webhook retries handle this fine.
# - The free instance has 512 MB RAM, which is plenty.
# - SQLite WILL NOT survive deploys here — set DATABASE_URL to a managed
#   Postgres (Supabase / Neon) before pushing live data.
#
# Usage:
# 1. Push this repo to GitHub.
# 2. Render dashboard → New → Blueprint → connect your GitHub repo → pick `main`.
# 3. Fill the env vars marked `sync: false` in the dashboard.
# 4. First deploy runs the build (console bundle + deps + migrations).

services:
  - type: web
    name: sales-automation
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    # The console is a React app compiled ahead of time, and its output is gitignored,
    # so nothing arrives with the checkout. Without the npm lines the service comes up
    # and every screen — including sign-in, which serves the same document — answers 503.
    #
    # `set -e` is load-bearing. A multi-line buildCommand is a shell script, and a
    # script's exit status is its LAST command's. Without it npm could fail, `test -f`
    # could fail, and the build would still "succeed" because init_db.py at the bottom
    # returned 0 — which is exactly how a release with no console reached production and
    # reported a successful build.
    buildCommand: |
      set -e
      node --version && npm --version
      npm --prefix frontend ci
      npm --prefix frontend run build
      test -f src/api/static/app/index.html
      pip install --upgrade pip setuptools
      pip install ".[postgres]"
      python scripts/init_db.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # For the console build above. Matches the version CI builds with.
      - key: NODE_VERSION
        value: "24"

      # ----- Required: set these manually in the Render dashboard -----
      - key: DATABASE_URL              # Supabase / Neon Postgres URI
        sync: false
      # Two secrets — set these in the Render dashboard (HubSpot App -> Auth tab).
      - key: HUBSPOT_ACCESS_TOKEN      # Private App access token (pat-na1-...)
        sync: false
      - key: HUBSPOT_WEBHOOK_SECRET    # Client secret — required for webhook v3 signature check
        sync: false
      - key: HUBSPOT_SENDER_ACTOR_ID
        value: "A-82843387"           # Perso Dubbing GTM Marketing
      - key: HUBSPOT_DEFAULT_EMAIL_CHANNEL_ACCOUNT_ID
        value: "2039804092"           # support@perso.ai, B2B Dubbing inbox fallback
      # [B2B] AI Dubbing pipeline (798618015) stage IDs — set here, no dashboard entry needed.
      # Names mirror the HubSpot stage labels. Stages get RENAMED without their id
      # changing, so the older env names still resolve as aliases (QUALIFIED was
      # "Meeting link sent" / AFTER_SEND, NOT_A_FIT was "Closed" / UNQUALIFIED).
      # THE BOARD HAS SEVEN COLUMNS AND ALL SEVEN MUST BE HERE: a stage with no id
      # configured is skipped by stage_id_to_local(), so HubSpot moves into it are
      # invisible and console moves out of it silently do not reach HubSpot (an empty
      # stage id reports "not attempted", which the sync banner does not warn about).
      - key: HUBSPOT_TICKET_STAGE_NEW
        value: "1172180243"            # New — the webhook "new inbound" trigger
      - key: HUBSPOT_TICKET_STAGE_QUALIFIED
        value: "1193842435"            # Qualified (ex-Meeting link sent) — after a reply is sent
      - key: HUBSPOT_TICKET_STAGE_NEGOTIATING
        value: "1193733925"            # Negotiating
      - key: HUBSPOT_TICKET_STAGE_REMINDER_SENT
        value: "1196621584"            # Reminder sent
      - key: HUBSPOT_TICKET_STAGE_WON
        value: "1196772135"            # Won
      - key: HUBSPOT_TICKET_STAGE_LOST
        value: "1172180246"            # Lost
      - key: HUBSPOT_TICKET_STAGE_NOT_A_FIT
        value: "1404814097"            # Not a Fit (ex-Closed, ex-Unqualified)
      - key: GOOGLE_CREDENTIALS_JSON   # Vertex AI service-account JSON (full contents)
        sync: false
      - key: GOOGLE_CLOUD_PROJECT      # optional; falls back to JSON project_id
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APPROVAL_CHANNEL_ID
        sync: false
      - key: PUBLIC_BASE_URL           # Render URL (Slack approval links, OAuth redirect base)
        value: https://sales-automation-4if2.onrender.com
      - key: WEB_UI_PASSWORD           # web UI login (HTTP Basic Auth) — used when AUTH_MODE=basic
        sync: false

      # ----- Web UI login: Google OAuth (optional; keep AUTH_MODE=basic until configured) -----
      # Dashboard-managed so flipping to "google_oauth" there isn't reverted by the blueprint.
      # Unset => defaults to "basic" in config (no lockout).
      - key: AUTH_MODE                 # set "basic" or "google_oauth" in the Render dashboard
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID    # Google Cloud OAuth 2.0 web client; redirect URI = <PUBLIC_BASE_URL>/auth/callback
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN      # only verified Google accounts on this domain may sign in
        value: estsoft.com
      # Operators are managed only in the `users` table (/settings/users). The first
      # sign-in on an empty table bootstraps an admin; no env allowlist exists.
      - key: SESSION_SECRET            # random long string; required when AUTH_MODE=google_oauth
        generateValue: true

      # ----- Google Sheets: user-OAuth only (service-account sharing is policy-blocked) -----
      # The OAuth client is GOOGLE_OAUTH_CLIENT_ID/_SECRET above — Sheets has none of
      # its own. Add the spreadsheets scope to that client, nothing else.
      # Set this and no one ever clicks "연결" on /pipeline — not after a redeploy, not
      # after a database reset. Issue it once with scripts/connect_google_sheets.py.
      - key: GOOGLE_SHEETS_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_SHEETS_ACCOUNT_EMAIL # display only: whose account the token belongs to
        sync: false
      # Only used by the browser connect flow, which the refresh token above replaces.
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY # delegated refresh-token encryption; separate from session/API secrets
        generateValue: true

      # ----- Auto-generated on first deploy -----
      - key: INTERNAL_API_TOKEN
        generateValue: true

      # ----- Production delivery and external synchronization -----
      # Only human-approved drafts are delivered. Immediate inbound auto-replies are
      # absent from the application and cannot be claimed by the send worker.
      - key: LIVE_EXTERNAL_WRITES
        value: "true"
      - key: LIVE_HUBSPOT_WRITES
        value: "true"
      - key: LIVE_SHEETS_WRITES
        value: "true"
      # ----- Sensible defaults (override in dashboard if needed) -----
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-2.5-pro
      - key: GOOGLE_CLOUD_LOCATION
        value: global
      - key: APPROVAL_CHANNEL
        value: none
      - key: SLACK_ENABLED
        value: "false"
      - key: WEB_UI_USERNAME
        value: admin
      # Webhook is primary; poller is the 10-minute recovery path for missed events.
      - key: SEND_WORKER_ENABLED
        value: "true"
      - key: INBOUND_POLL_ENABLED
        value: "true"
      - key: INBOUND_WORKER_ENABLED
        value: "true"
      - key: INBOUND_INITIAL_LOOKBACK_HOURS
        value: "24"
      - key: TIMEZONE
        value: Asia/Seoul
      - key: LOG_LEVEL
        value: INFO
      - key: APP_HOST
        value: 0.0.0.0
      - key: WEB_CONCURRENCY
        value: "1"
