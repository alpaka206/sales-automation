[project]
name = "sales-automation"
version = "0.1.0"
description = "Inbound inquiry, customer history, and sales operations with human-approved replies."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.7",
    "google-genai>=0.3",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
]

[project.optional-dependencies]
# Install with: pip install .[postgres]  — required when DATABASE_URL is postgres://
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "black>=24",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
