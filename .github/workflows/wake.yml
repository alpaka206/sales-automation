# 6시간마다 서비스를 한 번 깨웁니다 (2026-09-08 운영자 요청).
#
# **왜 밖에서 깨워야 하나.** 무료 Render 웹 서비스는 15분 무접속이면 잠들고, **자는
# 동안에는 자기 타이머도 안 돕니다.** 그래서 서비스가 스스로 깨어날 방법이 없습니다 —
# 밖에서 두드려야 합니다.
#
# 자는 동안 못 보는 것이 개인 Gmail 사서함입니다. 허브스팟 쪽은 웹훅이 깨워 주지만
# (티켓 생성·단계 변경·대화 메시지), 개인함으로 온 메일은 깨워 줄 것이 아무것도 없습니다.
#
# **한 번 두드리면 한 회차가 다 돕니다.** 폴러는 시작하자마자 모든 단계를 한 번 돌고
# 나서 잠듭니다(`run_poller` 가 `sleep` 을 **뒤에** 합니다) — 메일함 수집도 그 안에
# 들어 있습니다. 그러고 15분 뒤 다시 잠듭니다.
#
# **무료 시간을 거의 안 씁니다.** 워크스페이스당 월 750 인스턴스 시간인데, 하루 4번 ×
# 약 15분이면 한 달에 약 30시간입니다. 계속 깨워 두면 월 744시간이라 한도에 붙어
# 버립니다 — 그래서 「계속 켜 두기」가 아니라 「가끔 깨우기」입니다.
#
# **「마지막 접속으로부터 6시간」이 저절로 됩니다.** 누가 콘솔을 쓰는 동안에는 서비스가
# 깨어 있고 폴러가 알아서 돌므로, 그때 이 두드림이 겹쳐도 하는 일이 없습니다(추가 비용
# 0). 굳이 마지막 접속 시각을 기억해 시간을 미룰 이유가 없습니다.
name: wake

on:
  schedule:
    # 6시간마다 (UTC). GitHub 의 예약 실행은 정시를 보장하지 않고 몇 분 늦을 수 있는데,
    # 이 용도에는 아무 상관이 없습니다.
    - cron: "0 */6 * * *"
  # 손으로도 한 번 눌러 볼 수 있게 — 설정이 맞는지 확인할 때 씁니다.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 서비스 깨우기
        env:
          # 저장소 Variables 에 `APP_URL` 을 넣어 주세요 (예: https://…​.onrender.com).
          # 비밀이 아니라 Variables 입니다 — 공개 주소이고, Secrets 에 넣으면 로그에서
          # 가려져 무엇이 틀렸는지 못 봅니다.
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -e
          if [ -z "$APP_URL" ]; then
            echo "APP_URL 이 설정되지 않았습니다 — Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          # 자던 서비스는 깨어나는 데 1분쯤 걸립니다. 그래서 넉넉히 기다리고, 첫 요청이
          # 시간 초과로 끊겨도 두 번 더 시도합니다 — 깨우는 것 자체는 그 요청이 이미
          # 했으므로 두 번째는 대개 바로 200 입니다.
          curl --fail --silent --show-error \
               --max-time 180 --retry 2 --retry-all-errors --retry-delay 30 \
               "$APP_URL/healthz" && echo "" && echo "깨웠습니다."
